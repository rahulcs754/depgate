name: DepGate
description: Flags risky new npm packages (fresh versions, new install scripts, typosquats) in pull requests.
branding:
  icon: shield
  color: orange
inputs:
  github-token:
    description: Token used to read the base lockfile and post the PR comment.
    default: ${{ github.token }}
  lockfile:
    description: Path to package-lock.json, pnpm-lock.yaml or yarn.lock. Found automatically when empty.
    required: false
  config:
    description: Path to the DepGate config file.
    default: .depgate.json
  fail-on:
    description: "Fail the check at this severity or above: high, medium, low or none. Overrides the config file."
    required: false
outputs:
  findings:
    description: Number of findings.
runs:
  using: node20
  main: dist/index.js

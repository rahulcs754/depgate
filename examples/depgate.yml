# Copy to .github/workflows/depgate.yml in your repo
name: DepGate
on:
  pull_request:
    paths: ["package-lock.json", "pnpm-lock.yaml", "yarn.lock"]
  schedule:
    - cron: "0 3 * * 1"   # weekly ReachCheck of open Dependabot alerts (job summary)
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  security-events: read   # ReachCheck reads Dependabot alerts
jobs:
  depgate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rahulcs754/depgate@main
        with:
          fail-on: high              # new packages
          fail-on-reachable: none    # set "high" to fail when a reachable alert is high or critical
